name: Calculator task CI
on:
  push:
    branches: ['feat/calculator-agent/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: calculator-task-${{ github.ref }}
  cancel-in-progress: false
jobs:
  task:
    name: Calculator task CI
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: app
          persist-credentials: false
      - name: Checkout trusted Factory
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: erman-ksv/Onay-Agents-Factory
          ref: 18f6408007f95720e0e534636e8f2a322db82294
          path: factory
          token: ${{ secrets.FACTORY_READ_TOKEN }}
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install trusted Factory dependencies
        working-directory: factory
        run: pnpm install --frozen-lockfile
      - name: Prepare pinned sandbox image
        run: docker pull 'node@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392'
      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in src/calculator.mjs src/app.mjs test/calculator.test.mjs test/ui.test.mjs; do
            if [ -f "app/$file" ]; then node --check "app/$file" >/dev/null 2>&1; fi
          done
      - name: Task tests
        working-directory: factory
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: pnpm exec tsx orchestration/calculatorTaskCi.ts "$GITHUB_WORKSPACE/app" "$CANDIDATE_SHA" 'node@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392'
