<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onay Factory Calculator</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="calculator">
  <div id="display" class="display" aria-live="polite">0</div>
  <div class="keys">
    <button class="key" data-action="clear">C</button>
    <button class="key" data-action="backspace">⌫</button>
    <button class="key" data-key="/">÷</button>
    <button class="key" data-key="*">×</button>
    <button class="key" data-key="7">7</button>
    <button class="key" data-key="8">8</button>
    <button class="key" data-key="9">9</button>
    <button class="key" data-key="-">‑</button>
    <button class="key" data-key="4">4</button>
    <button class="key" data-key="5">5</button>
    <button class="key" data-key="6">6</button>
    <button class="key" data-key="+">+</button>
    <button class="key" data-key="1">1</button>
    <button class="key" data-key="2">2</button>
    <button class="key" data-key="3">3</button>
    <button class="key" data-action="equals">=</button>
    <button class="key" data-key="0" style="grid-column: span 2;">0</button>
    <button class="key" data-key=".">.</button>
  </div>
</div>
<script type="module" src="src/app.mjs"></script>
</body>
</html>
